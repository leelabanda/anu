<div class="page-wrapper">

  <div class="card" *ngFor="let product of filteredProducts">

    <!-- PRODUCT IMAGE -->
    <div
      class="image-container"
      (click)="openProduct(product.id)"
    >
      <img
        [src]="product.image"
        [alt]="product.name"
        class="product-image"
      />
    </div>

    <!-- PRODUCT DETAILS -->
    <div class="details">

      <h2>{{ product.name }}</h2>

      <h3>₹{{ product.currentPrice }}</h3>

      <p class="price-row">
        <span class="old-price">
          ₹{{ product.mrp }}
        </span>

        <span class="discount">
          {{ getDiscount(product.mrp, product.currentPrice) }}% OFF
        </span>
      </p>

      <ul>
        <li>✔ Perfect for Couples &amp; Gifts</li>
        <li>✔ Beautiful Warm Lighting</li>
        <li>✔ Premium Quality</li>
      </ul>

      <!-- ADD TO CART -->
      <button
        type="button"
        class="cart"
        (click)="addToCart(product)"
      >
        Add to Cart
      </button>

      <!-- VIEW DETAILS -->
      <button
        type="button"
        class="details-btn"
        (click)="openProduct(product.id)"
      >
        View Details →
      </button>

    </div>

  </div>

</div>
