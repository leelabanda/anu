<div class="profile-page">

    <div class="profile-card">


        <!-- ==================================
             PROFILE HEADER
        =================================== -->

        <div class="profile-header">

            <div class="profile-avatar">

                <span>
                    {{ user.name.charAt(0).toUpperCase() }}
                </span>

            </div>


            <div class="profile-title">

                <h2>
                    {{ user.name }}
                </h2>

                <p>
                    EasyRide Customer
                </p>

            </div>

        </div>


        <!-- ==================================
             PROFILE BODY
        =================================== -->

        <div class="profile-body">

            <h3>
                Profile Details
            </h3>


            <!-- NAME -->

            <div class="profile-row">

                <div class="profile-icon">
                    👤
                </div>

                <div class="profile-info">

                    <label>
                        Full Name
                    </label>

                    <p>
                        {{ user.name }}
                    </p>

                </div>

            </div>


            <!-- USERNAME -->

            <div class="profile-row">

                <div class="profile-icon">
                    &#64;
                </div>

                <div class="profile-info">

                    <label>
                        Username
                    </label>

                    <p>
                        {{ user.username }}
                    </p>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="profile-row">

                <div class="profile-icon">
                    ✉
                </div>

                <div class="profile-info">

                    <label>
                        Email
                    </label>

                    <p>
                        {{ user.email }}
                    </p>

                </div>

            </div>


            <!-- PHONE -->

            <div class="profile-row">

                <div class="profile-icon">
                    📞
                </div>

                <div class="profile-info">

                    <label>
                        Phone Number
                    </label>

                    <p>
                        {{ user.phone }}
                    </p>

                </div>

            </div>


            <!-- ADDRESS -->

            <div class="profile-row">

                <div class="profile-icon">
                    🏠
                </div>

                <div class="profile-info">

                    <label>
                        Address
                    </label>

                    <p>
                        {{ user.address }}
                    </p>

                </div>

            </div>


            <!-- CITY -->

            <div class="profile-row">

                <div class="profile-icon">
                    📍
                </div>

                <div class="profile-info">

                    <label>
                        City
                    </label>

                    <p>
                        {{ user.city }}
                    </p>

                </div>

            </div>


            <!-- STATE -->

            <div class="profile-row">

                <div class="profile-icon">
                    🌐
                </div>

                <div class="profile-info">

                    <label>
                        State
                    </label>

                    <p>
                        {{ user.state }}
                    </p>

                </div>

            </div>


            <!-- ==================================
                 BUTTONS
            =================================== -->

            <div class="profile-actions">

                <button
                    class="back-btn"
                    type="button"
                    (click)="goBack()"
                >
                    ← Back
                </button>


                <button
                    class="edit-btn"
                    type="button"
                    (click)="editProfile()"
                >
                    ✎ Edit Profile
                </button>

            </div>

        </div>

    </div>

</div>
