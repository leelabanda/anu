<footer class="footer">

    <!-- HOME -->

        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="footer-item"
    >
        <span class="icon">🏠</span>
        <span>Home</span>
    </a>


    <!-- CART -->
    <a
        routerLink="/cart"
        routerLinkActive="active"
        class="footer-item"

    <!-- HELP -->
