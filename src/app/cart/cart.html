<div class="cart-container">

  <h2>Shopping Cart</h2>

  <div class="cart-item" *ngFor="let item of cartItems; let i = index">

    <img [src]="item.image"
         [alt]="item.name"
         class="cart-image">

    <div class="cart-details">
      <h3>{{ item.name }}</h3>
      <p>{{ item.description }}</p>
      <h4>₹{{ item.price }}</h4>

      <button (click)="remove(i)" class="remove-btn">
        Remove
      </button>
    </div>

  </div>

  <div class="total">
    <h2>Total : ₹{{ getTotal() }}</h2>
  </div>

</div>
