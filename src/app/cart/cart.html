<div class="cart-page">

    <div class="cart-container">

        <h2>🛒 Shopping Cart</h2>


        <!-- EMPTY CART -->

        <div
            *ngIf="cartItems.length === 0"
            class="empty-cart"
        >

            <h3>Your cart is empty</h3>

            <button routerLink="/products">
                Continue Shopping
            </button>

        </div>


        <!-- CART ITEMS -->

        <div
            class="cart-item"
            *ngFor="let item of cartItems; let i = index"
        >

            <img
                [src]="item.image"
                [alt]="item.name"
                class="cart-image"
            >


            <div class="cart-details">

                <h3>
                    {{ item.name }}
                </h3>

                <p>
                    {{ item.description }}
                </p>

                <h4>
                    ₹{{ item.price }}
                </h4>


                <!-- QUANTITY -->

                <div class="quantity">

                    <button
                        (click)="decreaseQuantity(item)"
                    >
                        −
                    </button>

                    <span>
                        {{ item.quantity }}
                    </span>

                    <button
                        (click)="increaseQuantity(item)"
                    >
                        +
                    </button>

                </div>


                <!-- REMOVE -->

                <button
                    class="remove-btn"
                    (click)="removeItem(i)"
                >
                    Remove
                </button>

            </div>

        </div>


        <!-- TOTAL + BUY NOW -->

        <div
            class="cart-total"
            *ngIf="cartItems.length > 0"
        >

            <h2>
                Total : ₹{{ getTotal() }}
            </h2>


            <button
                class="buy-now-btn"
                (click)="buyNow()"
            >
                🛍️ Buy Now
            </button>

        </div>


    </div>

</div>
