<div class="login-page">

    <!-- Navbar -->

    <nav class="navbar">

      

    </nav>

    <!-- Hero Section -->

    <div class="hero">

        <!-- Left -->

        <div class="left-content">

            <h4>WELCOME TO ANU 3D PRINTING</h4>

            <h1>
                Transform <br>
                Your Ideas <br>
                <span>Into Reality</span>
            </h1>

            <p>
                High quality 3D printing services for prototypes,
                products and everything in between.
            </p>

            <div class="feature">
                📦 Custom 3D Models
            </div>

            <div class="feature">
                🛡 High Quality Prints
            </div>

            <div class="feature">
                🚚 Fast Delivery
            </div>

            <div class="feature">
                🎧 24/7 Support
            </div>

        </div>

        <!-- Login Card -->

        <div class="login-card">

    <h2>Welcome Back!</h2>

    <p class="subtitle">
        Login to your account
    </p>

    <input
        type="email"
        placeholder="Username or Email">

    <input
        [type]="showPassword ? 'text' : 'password'"
        placeholder="Password">

    <label class="remember">
        <input type="checkbox">
        Remember Me
    </label>

    <button (click)="login()">
        Login
    </button>

    <p class="register-text">
        Don't have an account?
        <a routerLink="/register">Register</a>
    </p>

</div>

    </div>

</div>
